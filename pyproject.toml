[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "doi-paper-downloader"
version = "0.1.0"
description = "Download paper PDFs by DOI through a Telegram bot/chat."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Daniele Padula"}]
dependencies = [
    "telethon>=1.34,<2",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/dpadula85/Telegram_SciHub_Downloader"

[project.scripts]
doi-paper-downloader = "doi_paper_downloader.cli:main"

[tool.setuptools]
packages = ["doi_paper_downloader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
